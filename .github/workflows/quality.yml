name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Linux UI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3
      - run: uv sync --dev
      - run: uv run ruff check .
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: uv run pytest
