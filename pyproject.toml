[project]
name = "neuroflex"
version = "0.1.0"
description = "Real-time touchless physical rehabilitation assessment prototype"
readme = "README.md"
authors = [
    { name = "akanksha-souloxy", email = "akanksha@souloxy.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.10",
    "PySide6>=6.8",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.125",
    "ruff>=0.9",
]

[project.optional-dependencies]
cuda = ["torch>=2.5"]
pose = ["mediapipe>=0.10.20"]

[project.scripts]
neuroflex = "neuroflex:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
